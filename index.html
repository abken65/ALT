<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALT 專業估算工具</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2430;--card:#f3f5f9;--bd:#d8dde6;--ac:#007bff;--mut:#667085}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8ebf0;--card:#1e232c;--bd:#323946;--mut:#9aa4b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:20px}
h1{font-size:1.7rem}h2{font-size:1.2rem;margin:28px 0 10px;border-top:1px solid var(--bd);padding-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
label{display:block;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:1rem}
.env{display:flex;gap:14px;flex-wrap:wrap;background:var(--card);padding:6px 14px 14px;border-radius:10px}
.env div{flex:1;min-width:180px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.m{background:var(--card);border-radius:10px;padding:12px 14px}
.m small{color:var(--mut)}.m b{display:block;font-size:1.45rem;margin-top:2px}
svg{width:100%;height:auto;background:var(--card);border-radius:10px}
.note{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>🛡️ ALT 專業估算工具</h1>

<div class="env">
  <div><label>活化能 Ea (eV)</label><input id="ea" type="number" value="0.6" step="0.1"></div>
  <div><label>正常使用溫度 TL (°C)</label><input id="tl" type="number" value="25"></div>
</div>

<h2>📥 資訊輸入區</h2>
<div class="grid">
  <div>
    <b>基礎測試條件</b>
    <label>1. 保固年份 (Year)</label><input id="yr" type="number" value="2" min="1">
    <label>2. 測試溫度 (°C)</label><input id="tt" type="number" value="50">
    <label>3. 可接受失效數 (r)</label><input id="fail" type="number" value="0" min="0">
  </div>
  <div>
    <b>可靠度三要素連動 (%)</b>
    <label>4. 信心水準 (Confidence Level %)</label><input id="cl" type="number" value="90" min="0" max="100" step="1">
    <label>5. 可靠度 (Reliability Index %)</label><input id="rel" type="number" value="90" min="0" max="100" step="1">
    <label>6. 實際樣品數 (Pcs)</label><input id="n" type="number" value="22" min="1" step="1">
  </div>
</div>
<p class="note">三要素連動：以最後修改的兩個欄位，自動推算第三個。</p>

<h2>📊 運算結果</h2>
<div class="res">
  <div class="m"><small>MTBF (小時)</small><b id="o-mtbf"></b></div>
  <div class="m"><small>測試時間 (小時)</small><b id="o-h"></b></div>
  <div class="m"><small>測試時間 (天)</small><b id="o-d"></b></div>
  <div class="m"><small>信賴水準 (Confidence Level)</small><b id="o-cl"></b></div>
  <div class="m"><small>可靠度 (Reliability)</small><b id="o-rel"></b></div>
  <div class="m"><small>加速因子 (AF)</small><b id="o-af"></b></div>
</div>

<h2>📈 壽命曲線趨勢圖</h2>
<svg id="chart" viewBox="0 0 700 340" role="img" aria-label="測試溫度與測試時間關係圖"></svg>
</main>

<script>
const K = 8.623e-5;
const $ = id => document.getElementById(id);
let last = ['cl', 'rel'];

// 卡方分配反函數（自由度為偶數 2(r+1)，以 Poisson 關係式 + 二分法求解）
function chi2cdf(x, r) {
  let term = Math.exp(-x / 2), sum = term;
  for (let k = 1; k <= r; k++) { term *= (x / 2) / k; sum += term; }
  return 1 - sum;
}
function chi2inv(p, r) {
  let lo = 0, hi = 10;
  while (chi2cdf(hi, r) < p) hi *= 2;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    chi2cdf(mid, r) < p ? lo = mid : hi = mid;
  }
  return (lo + hi) / 2;
}

function link(changed) {
  last = last.filter(k => k !== changed); last.push(changed);
  const lc = last.slice(-2);
  const cl = +$('cl').value / 100, rel = +$('rel').value / 100, n = +$('n').value;
  if (lc.includes('cl') && lc.includes('rel')) {
    if (cl > 0 && cl < 1 && rel > 0 && rel < 1)
      $('n').value = Math.max(1, Math.ceil(Math.log(1 - cl) / Math.log(rel)));
  } else if (lc.includes('cl') && lc.includes('n')) {
    if (cl > 0 && cl < 1 && n >= 1) $('rel').value = (Math.exp(Math.log(1 - cl) / n) * 100).toFixed(3);
  } else if (lc.includes('rel') && lc.includes('n')) {
    if (n >= 1) $('cl').value = ((1 - Math.pow(rel, n)) * 100).toFixed(3);
  }
  calc();
}

function drawChart(xs, ys) {
  const W = 700, H = 340, L = 70, R = 20, T = 20, B = 50;
  const ymax = Math.max(...ys) * 1.05, x0 = xs[0], x1 = xs[xs.length - 1];
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const sy = y => H - B - y / ymax * (H - T - B);
  let g = '';
  for (let i = 0; i <= 5; i++) {
    const v = ymax * i / 5, y = sy(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/>` +
         `<text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="currentColor">${v < 10 ? v.toFixed(1) : Math.round(v)}</text>`;
  }
  for (let t = 40; t <= 90; t += 10)
    g += `<text x="${sx(t)}" y="${H - B + 18}" text-anchor="middle" font-size="11" fill="currentColor">${t}</text>`;
  const pts = xs.map((x, i) => `${sx(x).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(' ');
  g += `<polygon points="${sx(x0)},${sy(0)} ${pts} ${sx(x1)},${sy(0)}" fill="#007BFF" opacity=".15"/>` +
       `<polyline points="${pts}" fill="none" stroke="#007BFF" stroke-width="3"/>` +
       `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="currentColor">測試溫度 (°C)</text>` +
       `<text transform="translate(16 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="currentColor">測試時間 (天)</text>`;
  $('chart').innerHTML = g;
}

function calc() {
  const ea = +$('ea').value, tl = +$('tl').value, yr = +$('yr').value, tt = +$('tt').value;
  const r = Math.max(0, Math.floor(+$('fail').value)), n = Math.max(1, +$('n').value);
  const clp = +$('cl').value, relp = +$('rel').value;
  const cl = Math.max(0.001, Math.min(0.9999, clp / 100));
  const mtbf = yr * 8760, tkL = tl + 273.15;
  const af = t => Math.exp((ea / K) * (1 / tkL - 1 / (t + 273.15)));
  const x = chi2inv(cl, r);
  const hours = mtbf * x / (2 * n * af(tt));
  $('o-mtbf').textContent = mtbf.toLocaleString() + ' hrs';
  $('o-h').textContent = hours.toFixed(2) + ' hrs';
  $('o-d').textContent = (hours / 24).toFixed(2) + ' Days';
  $('o-cl').textContent = clp.toFixed(3) + '%';
  $('o-rel').textContent = relp.toFixed(3) + '%';
  $('o-af').textContent = af(tt).toFixed(2);
  const xs = [], ys = [];
  for (let t = 40; t <= 94; t += 2) { xs.push(t); ys.push(mtbf * x / (2 * n * af(t)) / 24); }
  drawChart(xs, ys);
}

['cl', 'rel', 'n'].forEach(k => $(k).addEventListener('change', () => link(k)));
['ea', 'tl', 'yr', 'tt', 'fail'].forEach(k => $(k).addEventListener('input', calc));
calc();
</script>
</body>
</html>
